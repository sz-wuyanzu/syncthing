name: Build Syncthing Desktop (macOS)

on:
  push:
    branches:
      - desktop
    paths:
      - ".github/workflows/syncthing-desktop-macos.yml"
      - "syncthing-desktop/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: syncthing-desktop-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS installer
    runs-on: macos-latest
    defaults:
      run:
        working-directory: syncthing-desktop
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: syncthing-desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Test desktop backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build macOS installer
        run: npm run build

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Syncthing-Desktop-macos-${{ runner.arch }}
          path: syncthing-desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
