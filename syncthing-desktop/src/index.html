<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="styles.css" />
    <title>Syncthing</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="splash">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">S</div>
        <div>
          <p class="eyebrow">SYNCTHING DESKTOP</p>
          <h1>Your files, everywhere.</h1>
        </div>
      </div>
      <p class="status" id="status" role="status" aria-live="polite">
        Starting Syncthing…
      </p>
      <div class="loader" id="loader" aria-hidden="true"></div>
      <p class="error" id="error" role="alert" hidden></p>
      <button id="retry" type="button" hidden>Retry</button>
    </main>
  </body>
</html>
