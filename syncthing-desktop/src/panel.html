<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="stylesheet" href="panel.css" />
    <title>Syncthing Status</title>
    <script type="module" src="/panel.js" defer></script>
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">S</div>
          <div>
            <p class="eyebrow">SYNCTHING</p>
            <h1>Status</h1>
          </div>
        </div>
        <button class="icon-button" id="close" type="button" aria-label="Close panel">×</button>
      </header>

      <section class="summary" aria-live="polite">
        <div class="status-line">
          <span class="status-dot" id="status-dot"></span>
          <span id="state">Connecting…</span>
        </div>
        <div class="rates">
          <div class="rate">
            <span class="rate-label">↓ Download</span>
            <strong id="download-rate">—</strong>
          </div>
          <div class="rate">
            <span class="rate-label">↑ Upload</span>
            <strong id="upload-rate">—</strong>
          </div>
        </div>
      </section>

      <section class="activity">
        <div class="section-heading">
          <h2>Active downloads</h2>
          <span id="file-count" class="count">0</span>
        </div>
        <p id="empty-files" class="empty">No active downloads</p>
        <ul id="files" class="file-list"></ul>
      </section>

      <p class="error" id="error" role="alert" hidden></p>

      <footer class="actions">
        <button class="secondary-button" id="open-main" type="button">Open Syncthing</button>
        <button class="primary-button" id="toggle-sync" type="button" disabled>Pause syncing</button>
      </footer>
    </main>
  </body>
</html>
